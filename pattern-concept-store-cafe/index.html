<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Concept Store & Cafe — Riyadh</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cormorant Garamond (Serif) & Plus Jakarta Sans (Sans-serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Alpine.js (Perfect for lightweight, fast-loading micro-interactions & bilingual switching) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Cormorant Garamond', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            linen: '#FDFBF7',
                            sand: '#F4EFE6',
                            charcoal: '#1A1A1A',
                            stone: '#8E857B',
                            accent: '#C5A880',
                            accentHover: '#B3946B',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar matching Japandi aesthetic */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FDFBF7;
        }
        ::-webkit-scrollbar-thumb {
            background: #8E857B;
            border-radius: 3px;
        }
        /* Smooth page rendering */
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="globalStore()" class="bg-brand-linen text-brand-charcoal font-sans antialiased overflow-x-hidden" :dir="lang === 'ar' ? 'rtl' : 'ltr'">

    <!-- 1. NAVIGATION BAR (Sticky Header) -->
    <header class="sticky top-0 z-50 bg-brand-linen/95 backdrop-blur-md border-b border-brand-sand transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            
            <!-- Left Logo & Arabic Calligraphy Submark -->
            <div class="flex items-center space-x-4 space-x-reverse">
                <a href="#" class="flex flex-col">
                    <span class="font-serif text-2xl lg:text-3xl tracking-[0.2em] font-light text-brand-charcoal">PATTERN</span>
                    <span class="text-[10px] tracking-[0.4em] text-brand-stone font-light text-center" :class="lang === 'ar' ? 'text-right' : 'text-left'">باترن</span>
                </a>
            </div>

            <!-- Center Desktop Links -->
            <nav class="hidden md:flex space-x-8 space-x-reverse font-medium text-xs tracking-widest uppercase text-brand-stone">
                <a href="#concept" class="hover:text-brand-charcoal transition-colors" x-text="t('navConcept')"></a>
                <a href="#menu" class="hover:text-brand-charcoal transition-colors" x-text="t('navMenu')"></a>
                <a href="#store" class="hover:text-brand-charcoal transition-colors" x-text="t('navStore')"></a>
                <a href="#workshops" class="hover:text-brand-charcoal transition-colors" x-text="t('navWorkshops')"></a>
                <a href="#visit" class="hover:text-brand-charcoal transition-colors" x-text="t('navVisit')"></a>
            </nav>

            <!-- Right Action Cluster -->
            <div class="flex items-center space-x-3 sm:space-x-4 space-x-reverse">
                <!-- Bilingual Toggle -->
                <button @click="toggleLang()" class="text-xs font-semibold tracking-wider hover:text-brand-accent transition-colors px-2 py-1">
                    <span x-show="lang === 'en'">عربي</span>
                    <span x-show="lang === 'ar'">EN</span>
                </button>

                <!-- Cart Icon with Live Counter -->
                <button @click="cartOpen = true" class="relative p-2 text-brand-charcoal hover:text-brand-accent transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                    </svg>
                    <span x-show="cart.length > 0" x-text="cart.length" 
                          class="absolute -top-1 -right-1 bg-brand-accent text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center animate-bounce">
                    </span>
                </button>

                <!-- Primary Button: Order & Reserve -->
                <button @click="openBookingModal()" 
                        class="hidden sm:inline-block bg-brand-charcoal hover:bg-brand-accent text-white hover:text-brand-charcoal font-medium text-xs tracking-widest uppercase py-3 px-6 transition-all duration-300 rounded-none">
                    <span x-text="t('orderReserve')"></span>
                </button>

                <!-- Mobile Menu Toggle -->
                <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden p-2 hover:text-brand-accent">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16m-7 6h7" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Navigation Menu -->
        <div x-show="mobileMenuOpen" x-cloak class="md:hidden bg-brand-linen border-t border-brand-sand px-4 py-6 space-y-4 animate-fade-in">
            <a href="#concept" @click="mobileMenuOpen = false" class="block font-medium text-xs tracking-widest uppercase text-brand-stone hover:text-brand-charcoal" x-text="t('navConcept')"></a>
            <a href="#menu" @click="mobileMenuOpen = false" class="block font-medium text-xs tracking-widest uppercase text-brand-stone hover:text-brand-charcoal" x-text="t('navMenu')"></a>
            <a href="#store" @click="mobileMenuOpen = false" class="block font-medium text-xs tracking-widest uppercase text-brand-stone hover:text-brand-charcoal" x-text="t('navStore')"></a>
            <a href="#workshops" @click="mobileMenuOpen = false" class="block font-medium text-xs tracking-widest uppercase text-brand-stone hover:text-brand-charcoal" x-text="t('navWorkshops')"></a>
            <a href="#visit" @click="mobileMenuOpen = false" class="block font-medium text-xs tracking-widest uppercase text-brand-stone hover:text-brand-charcoal" x-text="t('navVisit')"></a>
            <button @click="mobileMenuOpen = false; openBookingModal()" class="w-full bg-brand-charcoal text-white text-xs font-semibold tracking-widest uppercase py-3 text-center">
                <span x-text="t('orderReserve')"></span>
            </button>
        </div>
    </header>

    <!-- 2. HERO SECTION (The Digital Twin) -->
    <section class="relative min-h-[calc(100vh-80px)] flex flex-col justify-between overflow-hidden bg-brand-charcoal">
        <!-- Cinematic Video Background Placeholder with High-end Architectural Styling -->
        <div class="absolute inset-0 z-0 opacity-40">
            <img src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&q=80&w=2000" 
                 alt="Pattern Riyadh Interior Design" 
                 class="w-full h-full object-cover filter saturate-50 contrast-125">
        </div>
        <div class="absolute inset-0 bg-gradient-to-t from-brand-charcoal via-transparent to-black/40 z-0"></div>

        <!-- Hero Core Content -->
        <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-20 pb-12 flex-grow flex flex-col justify-center text-center md:text-left" :class="lang === 'ar' ? 'md:text-right' : 'md:text-left'">
            <div class="max-w-3xl">
                <p class="text-brand-accent text-xs font-bold uppercase tracking-[0.3em] mb-4" x-text="t('heroLabel')"></p>
                <h1 class="font-serif text-4xl sm:text-5xl lg:text-7xl text-white font-light leading-tight mb-6">
                    <span x-text="t('heroTitleLine1')"></span><br>
                    <span class="italic font-normal text-brand-accent" x-text="t('heroTitleLine2')"></span>
                </h1>
                <p class="text-brand-sand/80 font-light text-base sm:text-lg mb-8 max-w-2xl" x-text="t('heroSubtext')"></p>
                
                <!-- Dual CTA -->
                <div class="flex flex-col sm:flex-row items-center space-y-4 sm:space-y-0 sm:space-x-4 sm:space-x-reverse justify-center md:justify-start">
                    <a href="#store" class="w-full sm:w-auto bg-brand-accent hover:bg-brand-linen text-brand-charcoal font-semibold text-xs tracking-widest uppercase py-4 px-8 text-center transition-all duration-300">
                        <span x-text="t('heroPrimaryCTA')"></span>
                    </a>
                    <a href="#menu" class="w-full sm:w-auto border border-white/40 hover:border-white text-white font-semibold text-xs tracking-widest uppercase py-4 px-8 text-center transition-all duration-300 backdrop-blur-sm">
                        <span x-text="t('heroSecondaryCTA')"></span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Social Proof Ticker (Bottom of Hero) -->
        <div class="relative z-10 bg-brand-sand/10 backdrop-blur-md border-t border-white/10 py-4">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center text-[11px] tracking-widest text-brand-sand uppercase gap-3">
                <div class="flex items-center space-x-2 space-x-reverse">
                    <span class="text-brand-accent">★ ★ ★ ★ ★</span>
                    <span x-text="t('socialProofRating')"></span>
                </div>
                <div class="h-px w-12 bg-white/20 hidden sm:block"></div>
                <div x-text="t('socialProofLocation')"></div>
                <div class="h-px w-12 bg-white/20 hidden sm:block"></div>
                <div x-text="t('socialProofPress')" class="italic text-brand-accent"></div>
            </div>
        </div>
    </section>

    <!-- 3. BRAND PILLARS (The Ecosystem) -->
    <section id="concept" class="py-24 border-b border-brand-sand relative bg-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center max-w-2xl mx-auto mb-16">
                <span class="text-brand-accent text-xs font-bold uppercase tracking-[0.2em]" x-text="t('ecosystemLabel')"></span>
                <h2 class="font-serif text-3xl sm:text-4xl lg:text-5xl font-light mt-2" x-text="t('ecosystemTitle')"></h2>
            </div>

            <!-- 3-Column asymmetric-feeling grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 lg:gap-12">
                
                <!-- Cafe Pillar -->
                <div class="group bg-brand-linen p-8 lg:p-10 border border-brand-sand hover:border-brand-accent transition-all duration-500">
                    <div class="w-12 h-12 bg-brand-sand rounded-none flex items-center justify-center mb-8 group-hover:bg-brand-accent transition-colors">
                        <!-- Specialty Cafe SVG Line Art Icon -->
                        <svg class="w-6 h-6 text-brand-charcoal" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 5c1.1 0 2-.9 2-2H4c0 1.1.9 2 2 2zM18 9v3m0 0v3m0-3h3m-3-3h-2m2 0V5a2 2 0 00-2-2H8a2 2 0 00-2 2v10a4 4 0 004 4h4a4 4 0 004-4v-1M6 9h12" />
                        </svg>
                    </div>
                    <h3 class="font-serif text-2xl font-light mb-4" x-text="t('pillar1Title')"></h3>
                    <p class="text-brand-stone text-sm leading-relaxed mb-6" x-text="t('pillar1Text')"></p>
                    <a href="#menu" class="inline-flex items-center text-xs tracking-wider font-bold uppercase text-brand-charcoal hover:text-brand-accent transition-colors">
                        <span x-text="t('pillar1CTA')"></span>
                        <span class="ml-2 mr-2">→</span>
                    </a>
                </div>

                <!-- Store Pillar -->
                <div class="group bg-brand-linen p-8 lg:p-10 border border-brand-sand hover:border-brand-accent transition-all duration-500">
                    <div class="w-12 h-12 bg-brand-sand rounded-none flex items-center justify-center mb-8 group-hover:bg-brand-accent transition-colors">
                        <!-- Curated Design Line Art Icon -->
                        <svg class="w-6 h-6 text-brand-charcoal" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                    </div>
                    <h3 class="font-serif text-2xl font-light mb-4" x-text="t('pillar2Title')"></h3>
                    <p class="text-brand-stone text-sm leading-relaxed mb-6" x-text="t('pillar2Text')"></p>
                    <a href="#store" class="inline-flex items-center text-xs tracking-wider font-bold uppercase text-brand-charcoal hover:text-brand-accent transition-colors">
                        <span x-text="t('pillar2CTA')"></span>
                        <span class="ml-2 mr-2">→</span>
                    </a>
                </div>

                <!-- Workshops Pillar -->
                <div class="group bg-brand-linen p-8 lg:p-10 border border-brand-sand hover:border-brand-accent transition-all duration-500">
                    <div class="w-12 h-12 bg-brand-sand rounded-none flex items-center justify-center mb-8 group-hover:bg-brand-accent transition-colors">
                        <!-- Community/Exhibition Line Art Icon -->
                        <svg class="w-6 h-6 text-brand-charcoal" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <h3 class="font-serif text-2xl font-light mb-4" x-text="t('pillar3Title')"></h3>
                    <p class="text-brand-stone text-sm leading-relaxed mb-6" x-text="t('pillar3Text')"></p>
                    <a href="#workshops" class="inline-flex items-center text-xs tracking-wider font-bold uppercase text-brand-charcoal hover:text-brand-accent transition-colors">
                        <span x-text="t('pillar3CTA')"></span>
                        <span class="ml-2 mr-2">→</span>
                    </a>
                </div>

            </div>
        </div>
    </section>

    <!-- 4. SERVICES / INTERACTIVE SHOWCASE (Tabs: Menu, Store, Workshops) -->
    <section id="showcase" class="py-24 bg-brand-linen">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <!-- Interactive Tab Selectors -->
            <div class="flex flex-wrap justify-center space-x-2 sm:space-x-4 space-x-reverse border-b border-brand-sand pb-4 mb-12">
                <button @click="showcaseTab = 'menu'" 
                        :class="showcaseTab === 'menu' ? 'border-brand-charcoal text-brand-charcoal bg-brand-sand' : 'border-transparent text-brand-stone hover:text-brand-charcoal'" 
                        class="px-6 py-3 font-serif text-lg sm:text-2xl font-light border-b-2 tracking-wide transition-all focus:outline-none">
                    ☕ <span x-text="t('tabMenuTitle')"></span>
                </button>
                <button @click="showcaseTab = 'store'" 
                        :class="showcaseTab === 'store' ? 'border-brand-charcoal text-brand-charcoal bg-brand-sand' : 'border-transparent text-brand-stone hover:text-brand-charcoal'" 
                        class="px-6 py-3 font-serif text-lg sm:text-2xl font-light border-b-2 tracking-wide transition-all focus:outline-none">
                    🛍️ <span x-text="t('tabStoreTitle')"></span>
                </button>
                <button @click="showcaseTab = 'workshops'" 
                        :class="showcaseTab === 'workshops' ? 'border-brand-charcoal text-brand-charcoal bg-brand-sand' : 'border-transparent text-brand-stone hover:text-brand-charcoal'" 
                        class="px-6 py-3 font-serif text-lg sm:text-2xl font-light border-b-2 tracking-wide transition-all focus:outline-none">
                    🗓️ <span x-text="t('tabWorkshopsTitle')"></span>
                </button>
            </div>

            <!-- TAB 1: CAFE MENU (Click & Collect) -->
            <div x-show="showcaseTab === 'menu'" class="animate-fade-in" id="menu">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                    <div>
                        <h3 class="font-serif text-3xl font-light mb-8 text-brand-accent" x-text="t('menuSec1Title')"></h3>
                        <div class="space-y-6">
                            <template x-for="item in menuItems.filter(i => i.cat === 'coffee')">
                                <div class="flex justify-between items-start border-b border-brand-sand pb-4">
                                    <div class="pr-4 pl-4">
                                        <h4 class="font-medium text-base text-brand-charcoal" x-text="lang === 'ar' ? item.nameAr : item.name"></h4>
                                        <p class="text-xs text-brand-stone mt-1" x-text="lang === 'ar' ? item.descAr : item.desc"></p>
                                    </div>
                                    <div class="flex flex-col items-end">
                                        <span class="font-serif text-lg font-light text-brand-charcoal" x-text="item.price + ' SAR'"></span>
                                        <button @click="addToCart(item)" class="mt-2 bg-brand-charcoal hover:bg-brand-accent text-white hover:text-brand-charcoal text-[10px] tracking-widest uppercase py-1 px-3 transition-colors">
                                            + <span x-text="t('add')"></span>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                    
                    <div>
                        <h3 class="font-serif text-3xl font-light mb-8 text-brand-accent" x-text="t('menuSec2Title')"></h3>
                        <div class="space-y-6">
                            <template x-for="item in menuItems.filter(i => i.cat === 'bakery')">
                                <div class="flex justify-between items-start border-b border-brand-sand pb-4">
                                    <div class="pr-4 pl-4">
                                        <h4 class="font-medium text-base text-brand-charcoal" x-text="lang === 'ar' ? item.nameAr : item.name"></h4>
                                        <p class="text-xs text-brand-stone mt-1" x-text="lang === 'ar' ? item.descAr : item.desc"></p>
                                    </div>
                                    <div class="flex flex-col items-end">
                                        <span class="font-serif text-lg font-light text-brand-charcoal" x-text="item.price + ' SAR'"></span>
                                        <button @click="addToCart(item)" class="mt-2 bg-brand-charcoal hover:bg-brand-accent text-white hover:text-brand-charcoal text-[10px] tracking-widest uppercase py-1 px-3 transition-colors">
                                            + <span x-text="t('add')"></span>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB 2: STORE CATALOG (Direct E-commerce Grid) -->
            <div x-show="showcaseTab === 'store'" class="animate-fade-in" id="store">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                    <template x-for="product in catalogItems">
                        <div class="group bg-white border border-brand-sand p-4 flex flex-col justify-between hover:border-brand-accent transition-all duration-300">
                            <div class="relative overflow-hidden aspect-square bg-brand-linen mb-6">
                                <img :src="product.image" :alt="product.name" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500">
                                <span class="absolute top-2 right-2 bg-brand-accent text-white text-[9px] font-bold tracking-widest uppercase px-2 py-1" x-show="product.tag" x-text="lang === 'ar' ? product.tagAr : product.tag"></span>
                            </div>
                            <div>
                                <p class="text-xs text-brand-stone uppercase tracking-wider mb-1" x-text="lang === 'ar' ? product.brandAr : product.brand"></p>
                                <h4 class="font-serif text-xl font-light text-brand-charcoal mb-2" x-text="lang === 'ar' ? product.nameAr : product.name"></h4>
                                <div class="flex justify-between items-center mt-4">
                                    <span class="font-serif text-lg font-light text-brand-charcoal" x-text="product.price + ' SAR'"></span>
                                    <button @click="addToCart(product)" class="bg-brand-charcoal hover:bg-brand-accent text-white hover:text-brand-charcoal text-xs tracking-widest uppercase py-2 px-4 transition-colors">
                                        <span x-text="t('addToCart')"></span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- TAB 3: WORKSHOPS & EVENTS (Booking) -->
            <div x-show="showcaseTab === 'workshops'" class="animate-fade-in" id="workshops">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <template x-for="evt in events">
                        <div class="group bg-white border border-brand-sand overflow-hidden flex flex-col md:flex-row hover:border-brand-accent transition-all duration-300">
                            <div class="md:w-2/5 aspect-[4/3] md:aspect-auto">
                                <img :src="evt.image" :alt="evt.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            </div>
                            <div class="p-6 md:w-3/5 flex flex-col justify-between">
                                <div>
                                    <div class="flex items-center justify-between mb-3">
                                        <span class="text-[10px] tracking-widest uppercase font-bold text-brand-accent" x-text="lang === 'ar' ? evt.dateAr : evt.date"></span>
                                        <span class="text-[10px] bg-brand-sand text-brand-charcoal px-2 py-1 font-semibold" x-text="evt.seatsLeft + ' ' + t('seatsLeft')"></span>
                                    </div>
                                    <h4 class="font-serif text-2xl font-light text-brand-charcoal mb-2" x-text="lang === 'ar' ? evt.titleAr : evt.title"></h4>
                                    <p class="text-xs text-brand-stone mb-4" x-text="lang === 'ar' ? evt.descAr : evt.desc"></p>
                                </div>
                                <div class="flex justify-between items-center border-t border-brand-sand pt-4 mt-4">
                                    <span class="font-serif text-lg font-light text-brand-charcoal" x-text="evt.price + ' SAR'"></span>
                                    <button @click="openBookingModal(evt)" class="bg-brand-charcoal hover:bg-brand-accent text-white hover:text-brand-charcoal text-xs tracking-widest uppercase py-2 px-4 transition-colors">
                                        <span x-text="t('secureSeat')"></span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

        </div>
    </section>

    <!-- 5. SOCIAL PROOF / COMMUNITY GALLERY ("The Vibe") -->
    <section class="py-24 bg-brand-charcoal text-white relative overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <div class="text-center max-w-2xl mx-auto mb-16">
                <span class="text-brand-accent text-xs font-bold uppercase tracking-[0.2em]" x-text="t('vibeLabel')"></span>
                <h2 class="font-serif text-3xl sm:text-4xl lg:text-5xl font-light mt-2 text-white" x-text="t('vibeTitle')"></h2>
            </div>

            <!-- Masonry Grid mimicking structural elegance -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-16">
                <div class="aspect-square bg-brand-linen/10 overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1543007630-9710e4a00a20?auto=format&fit=crop&q=80&w=800" alt="Specialty coffee pour over" class="w-full h-full object-cover filter brightness-90 hover:brightness-100 transition-all duration-300">
                </div>
                <div class="aspect-square bg-brand-linen/10 overflow-hidden md:translate-y-4">

                // Helper to render translations dynamically
                t(key) {
                    return this.translations[this.lang][key] || key;
                },

                toggleLang() {
                    this.lang = this.lang === 'en' ? 'ar' : 'en';
                },

                // Add items to the globally reactive cart
                addToCart(item) {
                    this.cart.push(item);
                    this.showToast(this.lang === 'ar' ? `تم إضافة ${item.nameAr} لسلتك` : `Added ${item.name} to cart.`);
                },

                removeFromCart(idx) {
                    const item = this.cart[idx];
                    this.cart.splice(idx, 1);
                    this.showToast(this.lang === 'ar' ? `تم إزالة العنصر من السلة` : `Removed item from cart.`);
                },

                cartTotal() {
                    return this.cart.reduce((sum, item) => sum + item.price, 0);
                },

                // Dynamic Booking Modal trigger
                openBookingModal(evt = null) {
                    if(evt) {
                        // pre-fill or customize table reservation with event details
                        this.bookingType = 'table';
                        this.bookingForm.notes = this.lang === 'ar' ? `حجز لورشة عمل: ${evt.titleAr}` : `Booking for: ${evt.title}`;
                    }
                    this.bookingModalOpen = true;
                },

                submitBooking() {
                    this.bookingModalOpen = false;
                    this.showToast(this.lang === 'ar' 
                        ? `تم تأكيد حجزك بنجاح! ننتظرك بكل حب في حي الياسمين.` 
                        : `Reservation confirmed! We look forward to seeing you in Al Yasmin.`);
                    
                    // Clear forms
                    this.bookingForm = { name: '', phone: '', date: '', time: '', guests: '2', notes: '' };
                },

                checkoutCart(method) {
                    this.cart = [];
                    this.cartOpen = false;
                    this.showToast(this.lang === 'ar' 
                        ? `تمت عملية الدفع بنجاح عبر ${method}. ستصلك رسالة تأكيد قصيرة.` 
                        : `Transaction processed successfully via ${method}. SMS receipt sent.`);
                },

                subscribeEmail() {
                    this.subscribed = true;
                    this.newsletterEmail = '';
                    setTimeout(() => { this.subscribed = false; }, 5000);
                },

                // Toast Logic
                showToast(msg) {
                    const id = Date.now();
                    this.toasts.push({ id, msg });
                    setTimeout(() => {
                        this.dismissToast(id);
                    }, 4000);
                },
                dismissToast(id) {
                    this.toasts = this.toasts.filter(t => t.id !== id);
                },

                // Testimonial Navigation
                nextTestimonial() {
                    this.activeTestimonial = (this.activeTestimonial + 1) % this.testimonials.length;
                },
                prevTestimonial() {
                    this.activeTestimonial = (this.activeTestimonial - 1 + this.testimonials.length) % this.testimonials.length;
                }
            };
        }
